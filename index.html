<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Vera</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--dark:#0A0804;}
body{background:var(--dark);color:#fff;font-family:'Raleway',sans-serif;min-height:100vh;overflow-x:hidden}
.site-bg{background:linear-gradient(135deg,#0A0804 0%,#1a1205 30%,#2a1d08 50%,#1a1205 70%,#0A0804 100%);min-height:100vh;display:flex;flex-direction:column;position:relative}
.site-bg::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(201,168,76,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}
header{position:relative;z-index:10;text-align:center;padding:1.2rem 2rem 1rem;border-bottom:1px solid rgba(201,168,76,0.2)}
.logo-line{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:.3rem}
.logo-line::before,.logo-line::after{content:'';flex:1;max-width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.logo-line::after{background:linear-gradient(90deg,var(--gold),transparent)}
h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,4.5rem);font-weight:300;letter-spacing:.3em;color:#fff;text-transform:uppercase;white-space:nowrap}
h1 span{color:var(--gold)}
.tagline{font-size:.72rem;letter-spacing:.35em;color:rgba(201,168,76,0.7);font-family:'Raleway',sans-serif;font-weight:400;text-transform:uppercase;margin-top:.2rem}
nav{display:none}
.cat-grid-home{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
  max-width:600px;
  margin:3rem auto 0;
  padding:0 1.5rem;
}
.cat-card{
  position:relative;
  aspect-ratio:1/1;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(201,168,76,0.2);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.6rem;
  cursor:pointer;
  transition:all .35s ease;
  overflow:hidden;
  text-decoration:none;
}
.cat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,0.07) 0%,transparent 70%);
  opacity:0;transition:opacity .35s;
}
.cat-card::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.6),transparent);
  opacity:0;transition:opacity .35s;
}
.cat-card:hover{
  background:rgba(255,255,255,0.07);
  border-color:rgba(201,168,76,0.5);
  transform:translateY(-3px);
  box-shadow:0 16px 40px rgba(0,0,0,0.5);
}
.cat-card:hover::before,.cat-card:hover::after{opacity:1}
.cat-card-icon{
  width:2px;height:28px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);
  opacity:.6;
}
.cat-card-name{
  font-family:'Playfair Display',serif;
  font-size:clamp(.9rem,3vw,1.15rem);
  font-weight:400;
  color:#fff;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-align:center;
  padding:0 .5rem;
  line-height:1.3;
}
.cat-card-sub{
  font-family:'Raleway',sans-serif;
  font-size:.6rem;
  letter-spacing:.2em;
  color:rgba(201,168,76,0.5);
  text-transform:uppercase;
  text-align:center;
}
/* Menu view back button */
.menu-back{
  display:none;
  align-items:center;gap:.6rem;
  background:none;border:none;
  color:rgba(201,168,76,0.6);
  font-family:'Raleway',sans-serif;
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;padding:.5rem 0;
  margin-bottom:2rem;
  transition:color .2s;
}
.menu-back.visible{display:flex}
.menu-back:hover{color:var(--gold)}
.menu-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
main{position:relative;z-index:3;max-width:1100px;width:100%;margin:0 auto;padding:1.5rem 2rem 0;flex:1}
.category-section{display:none;animation:fadeIn .4s ease}
.category-section.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cat-header{text-align:center;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid rgba(201,168,76,0.15)}
.cat-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:300;letter-spacing:.15em;color:#fff;text-transform:uppercase}
.cat-subtitle{font-size:.7rem;letter-spacing:.3em;color:rgba(201,168,76,0.6);font-family:'Raleway',sans-serif;text-transform:uppercase;margin-top:.5rem}
.gold-divider{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:1rem auto}
.gold-divider span{width:40px;height:1px;background:var(--gold);opacity:.5}
.gold-divider i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);opacity:.7}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:rgba(201,168,76,0.1)}
.menu-item{background:var(--dark);transition:background .3s;position:relative;overflow:hidden}
.menu-item:hover{background:#0f0b04}
.menu-item-body{padding:1.6rem 1.8rem}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.4rem}
.item-name{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:500;color:#fff;letter-spacing:.03em;line-height:1.3}
.item-price{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);white-space:nowrap}
.item-desc{font-size:.78rem;color:rgba(255,255,255,0.45);line-height:1.6;font-family:'Raleway',sans-serif}
.empty-state{text-align:center;padding:5rem 2rem;color:rgba(255,255,255,0.25)}
.empty-state p{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--dark);z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.8rem;transition:opacity .5s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-text{font-size:.72rem;letter-spacing:.3em;color:rgba(201,168,76,0.5);text-transform:uppercase;font-family:'Raleway',sans-serif}
.okey-wrap{position:relative;width:80px;height:80px}
.okey-tile{width:52px;height:70px;background:linear-gradient(160deg,#f5efe0,#e8d9b8);border-radius:5px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 4px 16px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;animation:okeyFlip 1.4s ease-in-out infinite}
.okey-tile-inner{font-size:1.6rem;font-weight:700;color:#C0392B;font-family:serif;line-height:1}
@keyframes okeyFlip{
  0%{transform:translate(-50%,-50%) rotateY(0deg) scale(1)}
  25%{transform:translate(-50%,-50%) rotateY(90deg) scale(0.9)}
  50%{transform:translate(-50%,-50%) rotateY(180deg) scale(1)}
  75%{transform:translate(-50%,-50%) rotateY(270deg) scale(0.9)}
  100%{transform:translate(-50%,-50%) rotateY(360deg) scale(1)}
}
.okey-glow{position:absolute;inset:-8px;border-radius:8px;background:radial-gradient(circle,rgba(201,168,76,0.15),transparent 70%);animation:okeyGlow 1.4s ease-in-out infinite}
@keyframes okeyGlow{0%,100%{opacity:.4}50%{opacity:1}}

footer{position:relative;z-index:5;text-align:center;padding:2rem 2rem 0;border-top:1px solid rgba(201,168,76,0.1);margin-top:3rem}
.footer-text{color:rgba(255,255,255,0.2);font-size:.7rem;letter-spacing:.15em;font-family:'Raleway',sans-serif}
.footer-location{display:block;margin:.4rem auto .2rem;font-size:.7rem;letter-spacing:.08em;color:rgba(201,168,76,0.55);text-decoration:none;transition:color .2s;font-family:'Raleway',sans-serif}
.footer-location:hover{color:rgba(201,168,76,0.9)}
.admin-open-btn{display:inline-block;margin:.8rem auto 1.5rem;background:transparent;border:none;color:rgba(255,255,255,0.12);font-family:'Raleway',sans-serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:.3rem .8rem;cursor:pointer;transition:color .3s}
.admin-open-btn:hover{color:rgba(201,168,76,0.5)}

/* SAVING */
.saving-indicator{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(10,8,4,0.97);border:1px solid rgba(201,168,76,0.35);color:rgba(201,168,76,0.9);font-size:.7rem;letter-spacing:.2em;padding:.6rem 1.8rem;z-index:10000;display:none;font-family:'Raleway',sans-serif;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.saving-indicator.visible{display:flex;align-items:center;gap:.6rem}
.saving-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:savePulse .7s ease infinite}
@keyframes savePulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.saving-indicator.done .saving-dot{animation:none;opacity:1;background:#5dbb7a}
.saving-indicator.done{border-color:rgba(93,187,122,0.35);color:rgba(150,230,170,0.9)}

/* LOGIN */
.login-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center}
.login-overlay.open{display:flex}
.login-box{background:linear-gradient(180deg,#0f0b04,#1a1205);border:1px solid rgba(201,168,76,0.25);width:90%;max-width:360px;padding:2.5rem;position:relative}
.login-logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:300;color:var(--gold);letter-spacing:.15em;text-align:center;margin-bottom:.4rem}
.login-sub{font-size:.65rem;letter-spacing:.2em;color:rgba(255,255,255,0.25);text-transform:uppercase;text-align:center;margin-bottom:2rem;font-family:'Raleway',sans-serif}
.login-label{display:block;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,0.6);margin-bottom:.5rem;font-family:'Raleway',sans-serif}
.login-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);color:#fff;font-family:'Raleway',sans-serif;font-size:.9rem;padding:.7rem 1rem;outline:none;border-radius:1px;transition:border-color .2s;margin-bottom:1.2rem}
.login-input:focus{border-color:rgba(201,168,76,0.5)}
.login-btn{width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Raleway',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:.75rem;cursor:pointer;transition:all .2s}
.login-btn:hover{background:var(--gold);color:var(--dark)}
.login-err{font-size:.72rem;color:rgba(220,100,100,0.8);text-align:center;margin-top:.8rem;display:none;font-family:'Raleway',sans-serif}
.login-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:rgba(255,255,255,0.3);font-size:1.2rem;cursor:pointer}

/* ADMIN */
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;overflow-y:auto}
.admin-overlay.open{display:flex;flex-direction:column}
.admin-panel{background:linear-gradient(180deg,#0f0b04,#1a1205);border:1px solid rgba(201,168,76,0.25);max-width:700px;width:90%;margin:2rem auto;border-radius:2px}
.admin-header{padding:1.5rem 2rem;border-bottom:1px solid rgba(201,168,76,0.2);display:flex;justify-content:space-between;align-items:center}
.admin-header h2{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:400;color:var(--gold);letter-spacing:.1em}
.admin-close{background:none;border:1px solid rgba(201,168,76,0.3);color:rgba(201,168,76,0.7);width:32px;height:32px;cursor:pointer;font-size:1rem;transition:all .2s}
.admin-close:hover{background:rgba(201,168,76,0.1);color:var(--gold)}
.admin-body{padding:2rem}
.admin-tabs{display:flex;margin-bottom:2rem;border-bottom:1px solid rgba(201,168,76,0.15)}
.admin-tab{background:none;border:none;color:rgba(255,255,255,0.4);font-family:'Raleway',sans-serif;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;padding:.7rem 1.2rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.admin-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.admin-tab-content{display:none}
.admin-tab-content.active{display:block}
.form-group{margin-bottom:1.2rem}
.form-label{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,0.7);margin-bottom:.5rem;font-family:'Raleway',sans-serif}
.form-input,.form-select,.form-textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);color:#fff;font-family:'Raleway',sans-serif;font-size:.9rem;padding:.7rem 1rem;outline:none;transition:border-color .2s;border-radius:1px}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(201,168,76,0.5)}
.form-select option{background:#1a1205;color:#fff}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-gold{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Raleway',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:.7rem 2rem;cursor:pointer;transition:all .2s;width:100%;margin-top:.5rem}
.btn-gold:hover{background:var(--gold);color:var(--dark)}
.btn-sm{width:auto;padding:.4rem 1rem;font-size:.65rem}
.btn-danger{border-color:rgba(255,80,80,0.5);color:rgba(255,80,80,0.7)}
.btn-danger:hover{background:rgba(255,80,80,0.15);color:rgba(255,120,120,1)}
.admin-list{display:flex;flex-direction:column;gap:.5rem;max-height:300px;overflow-y:auto}
.admin-list-item{background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,0.1);padding:.8rem 1rem;display:flex;align-items:center;gap:1rem}
.admin-list-item-info{flex:1;min-width:0}
.admin-list-item-name{font-size:.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Raleway',sans-serif}
.admin-list-item-meta{font-size:.72rem;color:rgba(255,255,255,0.35);margin-top:.2rem;font-family:'Raleway',sans-serif}
.admin-list-item-actions{display:flex;gap:.5rem;flex-shrink:0}
.admin-msg{font-size:.75rem;padding:.5rem 1rem;border-radius:1px;margin-top:.8rem;text-align:center;display:none;font-family:'Raleway',sans-serif}
.admin-msg.success{background:rgba(50,180,100,0.1);border:1px solid rgba(50,180,100,0.3);color:rgba(100,220,140,0.9)}
.admin-msg.error{background:rgba(200,50,50,0.1);border:1px solid rgba(200,50,50,0.3);color:rgba(220,100,100,0.9)}
.section-title{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,0.5);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(201,168,76,0.1);font-family:'Raleway',sans-serif}

.drag-handle{font-size:1.1rem;color:rgba(201,168,76,0.4);cursor:grab;padding:0 .5rem;user-select:none;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.draggable{cursor:default;transition:opacity .2s,background .2s}
.draggable.dragging{opacity:.4;background:rgba(201,168,76,0.08)}
.draggable.drag-over{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.4)}

.sort-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.sort-btn{background:none;border:1px solid rgba(201,168,76,0.25);color:rgba(201,168,76,0.7);width:26px;height:22px;cursor:pointer;font-size:.55rem;line-height:1;transition:all .2s;padding:0}
.sort-btn:hover:not(:disabled){background:rgba(201,168,76,0.15);border-color:rgba(201,168,76,0.6);color:var(--gold)}
.sort-btn-disabled{opacity:.2;cursor:not-allowed}

.icon-picker-wrap{position:relative}
.icon-preview-btn{
  width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);
  color:#fff;font-family:'Raleway',sans-serif;font-size:1.1rem;padding:.6rem 1rem;
  outline:none;border-radius:1px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:.8rem;transition:border-color .2s;
}
.icon-preview-btn:hover{border-color:rgba(201,168,76,0.5)}
.icon-preview-label{font-size:.75rem;color:rgba(255,255,255,0.4);font-family:'Raleway',sans-serif}
.icon-grid{
  display:none;position:absolute;top:100%;left:0;right:0;z-index:1000;
  background:#1a1205;border:1px solid rgba(201,168,76,0.25);
  display:none;grid-template-columns:repeat(6,1fr);gap:2px;padding:.5rem;
  max-height:220px;overflow-y:auto;
}
.icon-grid.open{display:grid}
.icon-opt{
  background:none;border:1px solid transparent;color:#fff;
  font-size:1.3rem;padding:.4rem;cursor:pointer;text-align:center;
  transition:all .2s;border-radius:2px;
}
.icon-opt:hover{background:rgba(201,168,76,0.15);border-color:rgba(201,168,76,0.3)}
.icon-opt.selected{background:rgba(201,168,76,0.2);border-color:rgba(201,168,76,0.5)}
.cat-card-icon-img{font-size:2rem;line-height:1;margin-bottom:.2rem}
</style>
</head>
<body>

<!-- LOADING -->

<canvas id="particleCanvas" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>
<div class="loading-screen" id="loadingScreen">
  <div class="okey-wrap">
    <div class="okey-glow"></div>
    <div class="okey-tile"><div class="okey-tile-inner">&#x2666;</div></div>
  </div>
  <div class="loading-text">Yükleniyor</div>
</div>

<!-- SAVING -->
<div class="saving-indicator" id="savingIndicator">
  <div class="saving-dot"></div>
  <span id="savingText">Kaydediliyor</span>
</div>

<div class="site-bg">
  <header>
    <div class="logo-line"><h1>CAFE <span>VERA</span></h1></div>
    <p class="tagline">M E N Ü</p>
  </header>
  <nav id="mainNav"></nav>
  <main><div id="catGridHome"></div><button class="menu-back" id="menuBack"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Kategoriler</button><div id="menuContent"></div></main>
  <footer>
    <p class="footer-text">CAFE VERA &nbsp;&mdash;&nbsp; Her Anı Bir Keyfe Dönüştürüyoruz</p>
    <a class="footer-location" href="https://yandex.com.tr/maps/11503/ankara/house/silahtar_cad_no_38a/Z0sYfgZpT0EEQF1jfXV1cnlgYg==/" target="_blank" rel="noopener">Ankara, Yenimahalle, Emniyet Mah., Silahtar Cad., 38A</a>
    <button class="admin-open-btn" id="adminOpenBtn">Yönetim Paneli</button>
  </footer>
</div>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <button class="login-close" id="loginClose">&#x2715;</button>
    <div class="login-logo">CAFE VERA</div>
    <div class="login-sub">Yönetim Paneli</div>
    <label class="login-label">Şifre</label>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••••••••••">
    <button class="login-btn" id="loginBtn">Giriş Yap</button>
    <div class="login-err" id="loginErr">Yanlış şifre. Tekrar deneyin.</div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <h2>Yönetim Paneli</h2>
      <button class="admin-close" id="adminClose">&#x2715;</button>
    </div>
    <div class="admin-body">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="cats">Kategoriler</button>
        <button class="admin-tab" data-tab="products">Ürün Ekle</button>
        <button class="admin-tab" data-tab="edit">Düzenle</button>
      </div>

      <div class="admin-tab-content active" id="tab-cats">
        <div class="form-group">
          <label class="form-label">Kategori Adı</label>
          <input class="form-input" id="catName" placeholder="örn. Sıcak İçecekler">
        </div>
        <div class="form-group">
          <label class="form-label">Alt Başlık (opsiyonel)</label>
          <input class="form-input" id="catSub" placeholder="örn. Premium kahveler">
        </div>
        <div class="form-group">
          <label class="form-label">İkon Seç (opsiyonel)</label>
          <div class="icon-picker-wrap">
            <button type="button" class="icon-preview-btn" id="iconPreviewBtn" onclick="toggleIconGrid()">
              <span id="iconPreviewVal">—</span>
              <span class="icon-preview-label">İkon seçmek için tıklayın</span>
            </button>
            <div class="icon-grid" id="iconGrid"></div>
          </div>
          <input type="hidden" id="catIcon">
        </div>
        <button class="btn-gold" id="addCatBtn">Kategori Ekle</button>
        <div class="admin-msg" id="catMsg"></div>
        <div style="margin-top:1.5rem">
          <div class="section-title">Mevcut Kategoriler</div>

async function loadData(){

function showSaved(){
  const ind=document.getElementById('savingIndicator');

  ind.classList.add('done');

async function saveData(data){

  isSaving=true;
  showSaving();
  try{
    await fetch(BASE_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(data)});
  }catch(e){}
  isSaving=false;
  showSaved();
}

async function moveProd(id,catId,dir){
  const catProds=appData.products.filter(p=>p.catId===catId);
  const i=catProds.findIndex(p=>p.id===id);
  const j=i+dir;
  if(j<0||j>=catProds.length)return;
  [catProds[i],catProds[j]]=[catProds[j],catProds[i]];
  const others=appData.products.filter(p=>p.catId!==catId);
  appData.products=[...others,...catProds];
  await saveData(appData);
  renderMenu();renderEditList();
}

// Particle background
(function(){
  const canvas=document.getElementById('particleCanvas');
  const ctx=canvas.getContext('2d');
  let W,H,particles=[];
  const COUNT=80;

  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
  }
  window.addEventListener('resize',resize);
  resize();

  function rand(min,max){return Math.random()*(max-min)+min;}

  for(let i=0;i<COUNT;i++){
    particles.push({
      x:rand(0,W),y:rand(0,H),
      r:rand(1.5,4),
      vx:rand(-0.35,0.35),vy:rand(-0.35,0.35),
      alpha:rand(0.25,0.7),
      pulse:rand(0,Math.PI*2),
      pulseSpeed:rand(0.01,0.03)
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.pulse+=p.pulseSpeed;
      const a=p.alpha*(0.6+0.4*Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(201,168,76,${a})`;
      ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-5)p.x=W+5;
      if(p.x>W+5)p.x=-5;
      if(p.y<-5)p.y=H+5;
      if(p.y>H+5)p.y=-5;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function buildIconGrid(hiddenId,previewId,currentIcon){
  const grid=document.getElementById('iconGrid');
  if(!grid)return;
  grid.innerHTML='';
  ICONS.forEach(ic=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='icon-opt'+(ic===currentIcon?' selected':'');
    btn.textContent=ic;
    btn.onclick=()=>{
      document.getElementById(hiddenId).value=ic;
      document.getElementById(previewId).textContent=ic;
      document.querySelectorAll('.icon-opt').forEach(o=>o.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('iconGrid').classList.remove('open');
    };
    grid.appendChild(btn);
  });
}

function toggleIconGrid(){
  const grid=document.getElementById('iconGrid');
  const current=document.getElementById('catIcon').value;
  if(!grid.classList.contains('open')){
    buildIconGrid('catIcon','iconPreviewVal',current);
    grid.classList.add('open');

}
